# One environment (dev or prod) on the VPS. Started by deploy.sh as Compose project "aap-<env>":
#   IMAGE_REF and APP_ENV come from deploy.sh, the settings of the environment (demo mode, the seed,
#   FILES_IN_DEMO, ENABLED_PLUGINS, INSTANCE_ID) from deploy/environments/<env>.env through
#   deploy.sh, POSTGRES_PASSWORD and the other secrets from /opt/aap/<env>/.env. Without its
#   settings an environment is a real installation: no demo mode, no seed.
# No host ports are published: Caddy (deploy/edge) reaches the backend over the "aap-edge" network.
#
# Limits (docs/DEPLOYMENT.md "Resource limits"): several instances and unrelated services share
# the host, so no container may grow without a bound. Logs are rotated per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # The write-ahead log may otherwise grow to 1 GB per instance; temp files are capped per session.
    command: ["postgres", "-c", "max_wal_size=256MB", "-c", "temp_file_limit=512MB"]
    mem_limit: 384m
    pids_limit: 200
    logging: *logging
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/aap/<env>/.env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: ${IMAGE_REF:?set by deploy.sh}
    pull_policy: never
    restart: unless-stopped
    # Two password hashes at a time need 128 MB (E7) and re-encoding one photo 30-75 MB (E11).
    # The CPU cap leaves the event loop room while a worker thread encodes a photo.
    mem_limit: 512m
    cpus: 2
    pids_limit: 200
    # Nothing grows inside the container layer; temporary files go to a small tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - type: bind
        source: ${AAP_ROOT:-/opt/aap}/${APP_ENV}/files
        target: /data/files
        bind:
          create_host_path: false
    logging: *logging
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD}@db:5432/app
      # The environment's name (dev, prod); an association's own VPS sets prod (install/).
      ENVIRONMENT: ${ENVIRONMENT:-${APP_ENV:?set by deploy.sh}}
      # Demo mode and the seed per environment (docs/DEPLOYMENT.md "Demo mode and the installation
      # marker"); off unless the settings of the environment turn them on.
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Which installation the database and the files belong to (src/core/instance/).
      INSTANCE_ID: ${INSTANCE_ID:?set in deploy/environments/<env>.env}
      # Login secrets from /opt/aap/<env>/.env (bootstrap.sh generates them); required at startup.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in /opt/aap/<env>/.env}
      AUTH_HASH_SECRET: ${AUTH_HASH_SECRET:?set in /opt/aap/<env>/.env}
      # Plugins per environment (dev: + the Estonian building register, E12).
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-common.csv_export}
      LOG_LEVEL: INFO
      # E-mail (an association's own VPS, install/; empty on the project's VPS): the site's address
      # for the links in mail, the SMTP account and the key of the unsubscribe links.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      NOTIFICATIONS_HASH_SECRET: ${NOTIFICATIONS_HASH_SECRET:-}
      # Uploaded files (epic E11): /opt/aap/<env>/files, created by bootstrap.sh. Uploads in demo
      # mode only where the settings of the environment allow them (dev).
      FILES_DIR: /data/files
      FILES_IN_DEMO: ${FILES_IN_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        aliases:
          - aap-${APP_ENV}-backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:

networks:
  internal: {}
  edge:
    external: true
    name: aap-edge
