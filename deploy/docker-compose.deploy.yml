# One environment (dev or prod) on the VPS. Started by deploy.sh as Compose project "aap-<env>":
#   IMAGE_REF, APP_ENV come from deploy.sh; POSTGRES_PASSWORD from /opt/aap/<env>/.env.
# No host ports are published: Caddy (deploy/edge) reaches the backend over the "aap-edge" network.
#
# Limits (docs/DEPLOYMENT.md "Resource limits"): several instances and unrelated services share
# the host, so no container may grow without a bound. Logs are rotated per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # The write-ahead log may otherwise grow to 1 GB per instance; temp files are capped per session.
    command: ["postgres", "-c", "max_wal_size=256MB", "-c", "temp_file_limit=512MB"]
    mem_limit: 384m
    pids_limit: 200
    logging: *logging
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/aap/<env>/.env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: ${IMAGE_REF:?set by deploy.sh}
    pull_policy: never
    restart: unless-stopped
    # Two password hashes at a time need 128 MB (E7) and one decoded photo about 30 MB (E11).
    # The CPU cap leaves the event loop room while a worker thread encodes a photo.
    mem_limit: 512m
    cpus: 2
    pids_limit: 200
    # Nothing grows inside the container layer; temporary files go to a small tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    logging: *logging
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD}@db:5432/app
      ENVIRONMENT: ${APP_ENV:?set by deploy.sh}
      # Public demo: graders switch roles via X-Demo-User-Id. Seeded data only, no real residents.
      DEMO_MODE_ENABLED: "true"
      # Login secrets from /opt/aap/<env>/.env (bootstrap.sh generates them); required at startup.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in /opt/aap/<env>/.env}
      AUTH_HASH_SECRET: ${AUTH_HASH_SECRET:?set in /opt/aap/<env>/.env}
      # The demo building, seeded once into an empty database (src/core/seed.py).
      SEED_DEMO_DATA: "true"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        aliases:
          - aap-${APP_ENV}-backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:

networks:
  internal: {}
  edge:
    external: true
    name: aap-edge
